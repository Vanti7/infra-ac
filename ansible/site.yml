- name: Socle commun
  # pve_host exclu : I13 (rôles Ansible hôte PVE) n'est pas encore fait, on
  # ne fait pas converger stargate-px1 vers le rôle base en side-effect d'un
  # ajout de zabbix-agent — portée volontairement limitée à ce qui est demandé.
  hosts: all:!pve_host
  become: true
  roles:
    - base

- name: IAM Keycloak
  hosts: iam
  become: true
  roles:
    - keycloak

- name: Bastion Teleport
  hosts: teleport
  become: true
  roles:
    - teleport

- name: Agents Teleport (ssh_service)
  hosts: k3s_cluster:iam
  become: true
  roles:
    - teleport-agent

- name: Cluster k3s — control-plane
  hosts: k3s_server
  become: true
  roles:
    - k3s-adm

- name: Cluster k3s — agents
  hosts: k3s_agents
  become: true
  roles:
    - k3s-agent

- name: Résolution DNS interne (source NetBox)
  hosts: all:!pve_host
  become: true
  roles:
    - dns-interne

- name: Supervision Zabbix (agents actifs)
  hosts: all
  become: true
  roles:
    - zabbix-agent
