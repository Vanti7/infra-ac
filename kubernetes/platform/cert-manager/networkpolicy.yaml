# I6 (audit) : default-deny + allow explicites. But egress vers 10.42.0.1
# (hôte PVE) et 10.99.0.0/24 (WireGuard) : jamais autorisé depuis un pod,
# quel que soit le namespace plateforme. cert-manager a besoin d'Internet
# (ACME Let's Encrypt + API Gandi pour le challenge DNS01), donc la règle
# "internet" est un ipBlock 0.0.0.0/0 avec except sur les plages internes.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cert-manager-default
  namespace: cert-manager
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {}
      # Admission webhooks (cert-manager-webhook) appelés directement par
      # kube-apiserver (hostNetwork sur k3s-adm, pas un pod → pas de
      # podSelector/namespaceSelector possible). PAS ipBlock 10.42.0.11/32
      # (l'IP de management du nœud) : pour du trafic ORIGINAIRE D'UN
      # PROCESSUS HÔTE (pas un pod) vers une IP pod, le noyau route via
      # flannel.1 et l'IP source vue par le nœud destinataire devient celle
      # de CETTE interface (10.44.0.0 pour k3s-adm), pas l'IP de management
      # — confirmé par capture tcpdump en direct + compteurs iptables
      # avant/après (0 hit sur la règle 10.42.0.11/32, healthz agissait
      # comme si aucune règle n'existait). D'où l'allow sur tout le pod CIDR
      # plutôt qu'une IP précise et fragile.
        - ipBlock:
            cidr: 10.44.0.0/16
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        # PAS 10.43.0.1 (ClusterIP du service kubernetes) : avec kube-router,
        # le DNAT vers l'IP réelle (Endpoints = 10.42.0.11:6443, k3s-adm) a
        # lieu avant l'évaluation du netpol egress, donc une règle sur le
        # ClusterIP ne matche jamais le paquet réellement filtré.
        - ipBlock: {cidr: 10.42.0.11/32}
      ports:
        - {protocol: TCP, port: 6443}
    - to:
        - podSelector: {}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except: ["10.42.0.0/24", "10.99.0.0/24"]
