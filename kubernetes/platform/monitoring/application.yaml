apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 88.1.3
    helm:
      values: |
        # node_exporter est déjà déployé par Ansible (rôle base) sur les 5 hôtes/CT,
        # en hostNetwork sur :9100 — le DaemonSet du chart entrerait en conflit de
        # port. On le désactive et on scrape les 5 en statique à la place.
        nodeExporter:
          enabled: false

        prometheus:
          prometheusSpec:
            retention: 10d
            # I7 (audit) : sans storageSpec, Prometheus tourne en emptyDir —
            # la retention 10d est fictive, tout est perdu au moindre restart
            # de pod.
            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: local-path
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests:
                      storage: 10Gi
            resources:
              requests:
                cpu: 200m
                memory: 512Mi
              limits:
                memory: 1Gi
            additionalScrapeConfigs:
              - job_name: node-exporter-hosts
                static_configs:
                  - targets:
                      - "10.42.0.1:9100"   # hôte PVE
                      - "10.42.0.5:9100"   # CT teleport
                      - "10.42.0.6:9100"   # CT iam
                      - "10.42.0.11:9100"  # k3s-adm
                      - "10.42.0.21:9100"  # k3s-w1
                      - "10.42.0.22:9100"  # k3s-w2

        alertmanager:
          alertmanagerSpec:
            storage:
              volumeClaimTemplate:
                spec:
                  storageClassName: local-path
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests:
                      storage: 1Gi
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                memory: 256Mi
          # I7 (audit) : aucune route de notification jusqu'ici — rien ne
          # préviendrait de C2 (panne disque/backup). ntfy.sh : topic public
          # mais non-devinable, zéro identifiant à gérer/chiffrer. Le repo
          # est privé (C1) donc ce topic n'est pas exposé publiquement.
          config:
            route:
              receiver: ntfy
              group_by: ["alertname"]
              group_wait: 30s
              group_interval: 5m
              repeat_interval: 4h
            receivers:
              - name: ntfy
                webhook_configs:
                  - url: https://ntfy.sh/aetheriscloud-alerts-7e9d1f49912a95b5
                    send_resolved: true
              # Le chart injecte une sous-route par défaut (alerte interne
              # Watchdog, sert à vérifier que le pipeline Prometheus->
              # Alertmanager tourne) qui référence ce nom de receiver —
              # doit exister même vide, sinon l'operator refuse la config.
              - name: "null"

        grafana:
          admin:
            existingSecret: grafana-admin-secret
          # I7 : persistence désactivée par défaut sur ce chart — dashboards
          # perso et config perdus au moindre redémarrage de pod.
          persistence:
            enabled: true
            storageClassName: local-path
            size: 1Gi
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          service:
            type: ClusterIP
          envValueFrom:
            GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
              secretKeyRef:
                name: grafana-oidc-secret
                key: CLIENT_SECRET
          grafana.ini:
            server:
              root_url: https://grafana.ops.aetheriscloud.fr
            auth.generic_oauth:
              enabled: true
              name: Keycloak
              client_id: grafana
              client_secret: $__env{GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET}
              scopes: "openid profile email"
              auth_url: https://sso.aetheriscloud.fr/realms/infra/protocol/openid-connect/auth
              token_url: https://sso.aetheriscloud.fr/realms/infra/protocol/openid-connect/token
              api_url: https://sso.aetheriscloud.fr/realms/infra/protocol/openid-connect/userinfo
              role_attribute_path: "contains(groups[*], 'infra-admins') && 'Admin' || 'Viewer'"
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # Pitfall documenté (workflow §5.4) : les CRD Prometheus dépassent
      # 262144 octets, la limite de l'annotation last-applied-configuration
      # en client-side apply — chaque sync échouait en boucle dès qu'une
      # CRD changeait de version/taille (ex: après ce commit-ci).
      - ServerSideApply=true
