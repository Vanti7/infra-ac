{{/*
Une seule NetworkPolicy plutôt que plusieurs séparées (default-deny +
allow-*) : validé en conditions réelles que kube-router (moteur de netpol
de k3s) n'unit pas correctement plusieurs objets NetworkPolicy ciblant les
mêmes pods — seule une politique combinée en un seul objet applique
effectivement l'ensemble des règles d'allow attendues, le reste restant
refusé par défaut (implicite dès qu'au moins une NetworkPolicy sélectionne
le pod).
*/}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: client-netpol
  namespace: cust-{{ .Values.name }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.traefikNamespace }}
    # I8 (audit) : sans ça, le scrape Prometheus par tenant (prévu au plan)
    # ne fonctionnera jamais — le netpol tenant ne laissait rien passer
    # depuis monitoring.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
  egress:
    - to:
        - podSelector: {}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
