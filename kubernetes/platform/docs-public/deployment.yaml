apiVersion: apps/v1
kind: Deployment
metadata:
  name: docs-public
  namespace: docs-public
spec:
  replicas: 1
  selector:
    matchLabels:
      app: docs-public
  template:
    metadata:
      labels:
        app: docs-public
    spec:
      containers:
        - name: docs-public
          image: harbor.aetheriscloud.fr/aetheriscloud/docs-public:1.0.2
          ports:
            - containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 101
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: docs-public
  namespace: docs-public
spec:
  selector:
    app: docs-public
  ports:
    - port: 80
      targetPort: 8080
