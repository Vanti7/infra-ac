global:
  domain: localhost:8080

configs:
  params:
    server.insecure: "true"

  cm:
    url: "https://argocd.ops.aetheriscloud.fr"
    oidc.config: |
      name: Keycloak
      issuer: https://sso.aetheriscloud.fr/realms/infra
      clientID: argocd
      clientSecret: $argocd-oidc-secret:oidc.clientSecret
      requestedScopes:
        - openid
        - profile
        - email
    # ksops (C3) : le repo-server invoque kustomize avec un plugin exec, désactivé
    # par défaut dans Kustomize pour des raisons de sécurité (exécution de binaire
    # arbitraire) — nécessaire pour que le générateur ksops tourne.
    kustomize.buildOptions: "--enable-alpha-plugins --enable-exec"

  rbac:
    policy.csv: |
      g, oidc:infra-admins, role:admin
    policy.default: role:readonly

dex:
  enabled: false

server:
  service:
    type: ClusterIP
  ingress:
    enabled: false

# ksops (C3) : permet à ArgoCD de rendre des Secrets chiffrés SOPS/age directement
# depuis Git (kustomization.yaml + generators: [secret.enc.yaml]), au lieu du
# `kubectl create secret` manuel utilisé jusqu'ici pour tout secret applicatif.
# La clé age privée elle-même reste hors Git par nécessité (elle déchiffre tout
# le reste) : Secret k8s `sops-age-key` créé une fois à la main dans le namespace
# argocd (`kubectl -n argocd create secret generic sops-age-key --from-file=keys.txt=~/.config/sops/age/keys.txt`).
repoServer:
  volumes:
    - name: custom-tools
      emptyDir: {}
    - name: sops-age-key
      secret:
        secretName: sops-age-key
  initContainers:
    - name: install-ksops
      image: viaductoss/ksops:v4.5.1
      command: ["/usr/local/bin/ksops", "install", "--with-kustomize", "/custom-tools"]
      volumeMounts:
        - mountPath: /custom-tools
          name: custom-tools
  volumeMounts:
    - mountPath: /usr/local/bin/kustomize
      name: custom-tools
      subPath: kustomize
    - mountPath: /usr/local/bin/ksops
      name: custom-tools
      subPath: ksops
    - mountPath: /.config/sops/age/keys.txt
      name: sops-age-key
      subPath: keys.txt
      readOnly: true
  env:
    - name: SOPS_AGE_KEY_FILE
      value: /.config/sops/age/keys.txt
