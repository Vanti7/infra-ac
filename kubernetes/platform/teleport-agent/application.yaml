apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: teleport-kube-agent
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://charts.releases.teleport.dev
    chart: teleport-kube-agent
    targetRevision: 18.10.3
    helm:
      values: |
        kubeClusterName: dedibox
        roles: kube,app
        proxyAddr: teleport.aetheriscloud.fr:443
        # Jeton généré via `tctl tokens add --type=kube,app`, TTL 1h : injecté hors Git
        # dans le Secret teleport-kube-agent-join-token (namespace teleport-agent).
        joinTokenSecret:
          create: false
          name: teleport-kube-agent-join-token
        apps:
          - name: argocd
            uri: http://argocd-server.argocd.svc.cluster.local:80
            public_addr: argocd.teleport.aetheriscloud.fr
          # Harbor volontairement absent : son externalURL sert aussi à générer
          # l'URL d'authentification que containerd utilise pour puller les
          # images (Www-Authenticate: realm=...). La faire pointer vers Teleport
          # casserait les pulls (containerd n'a pas de session Teleport). Harbor
          # reste en accès direct WG/NodePort (http://10.42.0.11:30002).
          - name: grafana
            uri: http://monitoring-grafana.monitoring.svc.cluster.local:80
            public_addr: grafana.teleport.aetheriscloud.fr
          - name: gitea
            uri: http://gitea-http.gitea.svc.cluster.local:3000
            public_addr: gitea.teleport.aetheriscloud.fr
          - name: docs-internal
            uri: http://docs-internal.docs-internal.svc.cluster.local:80
            public_addr: docs-internal.teleport.aetheriscloud.fr
        updater:
          enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: teleport-agent
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
