# I6 : default-deny + allow explicites. Doc statique servie par nginx,
# exposée publiquement via Traefik (docs.aetheriscloud.fr).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: docs-public-default
  namespace: docs-public
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
