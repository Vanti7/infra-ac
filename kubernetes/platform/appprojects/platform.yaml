# I9 (audit) : toutes les Application tournaient en `project: default`
# (aucune restriction de repo/destination/ressource cluster). Ce projet
# couvre les apps plateforme (pas les tenants, cf. `tenants.yaml`) : les
# repos Helm externes utilisés + le repo GitOps lui-même. Destination en
# wildcard (voir plus bas pourquoi) : la frontière de sécurité réelle est
# sourceRepos + clusterResourceWhitelist, pas la liste de namespaces.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
spec:
  description: Composants plateforme (namespaces système + apps internes, pas les tenants)
  sourceRepos:
    - git@github.com:Vanti7/infra-ac.git
    - https://charts.jetstack.io
    - https://bwolf.github.io/cert-manager-webhook-gandi
    - https://dl.gitea.com/charts/
    - https://helm.goharbor.io
    - https://prometheus-community.github.io/helm-charts
    - https://charts.netbox.oss.netboxlabs.com/
    - https://charts.releases.teleport.dev
    - https://traefik.github.io/charts
  # L'app `secrets` (ksops) ne fixe pas de destination.namespace unique — ses
  # ressources visent 7 namespaces différents (chaque Secret porte son propre
  # metadata.namespace). Un wildcard ici ne change rien à CE qui est déployé
  # (toujours limité aux namespaces écrits dans les manifestes) : la vraie
  # frontière de sécurité, c'est sourceRepos + clusterResourceWhitelist.
  destinations:
    - server: https://kubernetes.default.svc
      namespace: "*"
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
    - group: apiregistration.k8s.io
      kind: APIService
    - group: networking.k8s.io
      kind: IngressClass
