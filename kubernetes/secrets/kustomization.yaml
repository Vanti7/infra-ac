# Racine kustomize dédiée aux secrets chiffrés SOPS/ksops (C3 de l'audit).
# Doit être la racine `source.path` de sa PROPRE Application ArgoCD
# (kubernetes/platform/secrets/application.yaml) — PAS un sous-dossier
# récupéré par le directory-recurse de "platform" : ArgoCD ne détecte
# kustomization.yaml qu'à la racine du `source.path` d'une Application,
# jamais en récursif dans un dossier brut (vérifié en conditions réelles,
# cf. workflow-deploiement-dedibox.md — la version de test s'appelait
# ksops-test, retirée une fois la plomberie validée).
#
# Un générateur par secret, ajouté au fur et à mesure de la migration :
# generators:
#   - gitea-db-secret.generator.yaml
#   - argocd-oidc-secret.generator.yaml
#   - ...
generators: []
