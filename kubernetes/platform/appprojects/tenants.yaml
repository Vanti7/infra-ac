# I9 : les Application tenant-* (générées par l'ApplicationSet) n'ont besoin
# que du repo GitOps et des namespaces cust-*. clusterResourceWhitelist vide
# volontairement : un chart tenant ne doit jamais pouvoir créer de ressource
# cluster (ClusterRole, CRD...) — c'est la définition même de l'isolation
# multi-tenant.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: tenants
  namespace: argocd
spec:
  description: Namespaces clients (cust-*), pilotés par l'ApplicationSet tenants
  sourceRepos:
    - git@github.com:Vanti7/infra-ac.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: "cust-*"
  clusterResourceWhitelist: []
