# I6 : default-deny + allow explicites. teleport-kube-agent est un connecteur
# sortant (tunnel inversé vers le proxy Teleport) qui doit aussi pouvoir
# atteindre les pods backend de chaque app_service (docs-internal, gitea,
# grafana...) dans leurs namespaces respectifs — d'où l'egress large vers le
# CIDR pods/services du cluster. Aucune entrée nécessaire (pas de trafic
# entrant vers ce pod).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: teleport-agent-default
  namespace: teleport-agent
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - ipBlock: {cidr: 10.44.0.0/16}
    - to:
        - ipBlock: {cidr: 10.43.0.0/16}
    - to:
        # PAS 10.42.0.5 (IP interne Teleport) : rejette toute connexion
        # directe (même famille de problème que Keycloak/10.42.0.6 — PROXY
        # protocol requis, fourni par HAProxy uniquement). Le tunnel inversé
        # se connecte réellement via le hairpin par l'IP publique (résolution
        # DNS normale de teleport.aetheriscloud.fr). Découvert en cassant la
        # connectivité en direct (redémarrage du pod pour ajouter l'app
        # zabbix) : la connexion établie AVANT ce netpol survivait, seul un
        # redémarrage révèle le blocage — même symptôme que netbox-worker.
        - ipBlock: {cidr: 51.15.191.67/32}
      ports:
        - {protocol: TCP, port: 443}
    - to:
        # apiserver réel (PAS 10.43.0.1, le ClusterIP : DNAT avant netpol
        # avec kube-router, cf. netbox). Le kube_cluster proxifie kubectl
        # via Teleport jusqu'à l'apiserver, silencieux tant que personne ne
        # fait de kubectl-via-tsh (le pod ne crash pas, la requête échoue).
        - ipBlock: {cidr: 10.42.0.11/32}
      ports:
        - {protocol: TCP, port: 6443}
