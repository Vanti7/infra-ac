apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: netbox
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://charts.netbox.oss.netboxlabs.com/
    chart: netbox
    targetRevision: 8.3.47
    helm:
      values: |
        # netbox.aetheriscloud.fr résout en public vers l'IP privée 10.42.0.11
        # (même pattern que Harbor, cf. workflow) : le plan prévoyait Traefik +
        # ipAllowList (10.99.0.0/24, 10.42.0.0/24), mais avec notre WireGuard en
        # split-tunnel le trafic vers un hostname public ne passe jamais par le
        # tunnel — Traefik verrait notre IP publique réelle, pas notre IP WG, et
        # bloquerait tout le monde. Accès direct par NodePort à la place.
        service:
          type: NodePort
          nodePort: "30004"

        superuser:
          existingSecret: netbox-superuser

        # `auth.existingSecretName` ne fonctionne pas avec cette version du
        # sous-chart (clés attendues différentes : password/postgres-password,
        # pas postgresql-password) — le chart régénère son propre secret quoi
        # qu'il arrive, et ArgoCD écrasait notre secret manuel à chaque sync.
        # On laisse le chart gérer le sien (mot de passe copié dans
        # secrets/netbox_db_password.txt pour référence, cf. workflow).
        postgresql:
          enabled: true

        remoteAuth:
          enabled: true
          backends:
            - social_core.backends.open_id_connect.OpenIdConnectAuth

        # `extraConfig` (mécanisme documenté par le chart) ne fonctionne pas avec
        # cette image : le loader de config de NetBox (netbox/configuration.py)
        # ne scanne que /etc/netbox/config/*.py, pas les .yaml montés ailleurs
        # par extraConfig. Montage direct à la place, en Python valide.
        extraVolumes:
          - name: sso-config
            secret:
              secretName: netbox-sso-config
        extraVolumeMounts:
          - name: sso-config
            mountPath: /etc/netbox/config/990-sso.py
            subPath: sso.py
            readOnly: true

        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            memory: 1Gi

        # 1 primaire + 3 répliques par défaut, très excessif pour un IPAM à
        # usage unique sur ce cluster. Simple cache/queue, pas besoin de HA.
        valkey:
          replica:
            replicaCount: 0
  destination:
    server: https://kubernetes.default.svc
    namespace: netbox
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
