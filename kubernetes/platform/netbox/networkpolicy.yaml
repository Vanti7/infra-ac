# I6 : default-deny + allow explicites. NetBox exposé publiquement via
# Traefik, OIDC Keycloak, pas de besoin Internet.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: netbox-default
  namespace: netbox
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - ipBlock: {cidr: 10.42.0.6/32}
      ports:
        - {protocol: TCP, port: 443}
    - to:
        - podSelector: {}
