apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://helm.releases.hashicorp.com
    chart: vault
    targetRevision: 0.34.0
    helm:
      values: |
        # Mode standalone (storage "file", pas de TLS) : accès WG/port-forward
        # uniquement, même modèle de confiance que ArgoCD/Gitea. Pas de Consul/HA
        # nécessaire pour un usage mono-opérateur.
        injector:
          enabled: false
        server:
          dataStorage:
            size: 10Gi
  destination:
    server: https://kubernetes.default.svc
    namespace: vault
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
