# I6 : default-deny + allow explicites.
# M18 : Gitea garde son accès web via Teleport (browser), mais gagne un accès
# CLI (git clone/push en SSH) via le NodePort 30022 — jamais public, seulement
# joignable depuis le réseau interne (10.42.0.0/24) ou WireGuard
# (10.99.0.0/24), cf. exploitation.md. Le trafic NodePort peut arriver soit
# SNATé à l'IP d'un nœud (10.42.0.0/24) soit avec l'IP WG d'origine selon le
# chemin de routage — on autorise les deux, jamais Internet.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gitea-default
  namespace: gitea
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: teleport-agent
    - from:
        - ipBlock: {cidr: 10.42.0.0/24}
        - ipBlock: {cidr: 10.99.0.0/24}
      ports:
        - {protocol: TCP, port: 22}
        - {protocol: TCP, port: 3000}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        # PAS 10.42.0.6 (IP interne Keycloak) : son nginx exige le protocole
        # PROXY (fourni par HAProxy uniquement) et reset toute connexion
        # directe. Le chemin qui marche réellement est le hairpin par l'IP
        # publique (résolution DNS normale de sso.aetheriscloud.fr) : sort
        # du pod, repasse par HAProxy avec PROXY protocol, atteint Keycloak.
        # Vérifié en direct (argocd-server y arrive, gitea/netbox/portal non
        # avant ce correctif).
        - ipBlock: {cidr: 51.15.191.67/32}
      ports:
        - {protocol: TCP, port: 443}
    - to:
        - podSelector: {}
