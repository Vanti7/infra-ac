[defaults]
inventory                  = inventory/terraform.yml,inventory/pve-host.yml,inventory/home-nas.yml
roles_path                 = roles
remote_user                = admin
# Clé des VM/CT provisionnées par Terraform : inventory/terraform.yml ne la
# porte pas, donc sans ça le playbook ne marche que si la clé est déjà
# chargée dans l'agent SSH (invisible sur un checkout neuf — cf. I12).
# Les inventaires statiques qui utilisent une autre clé la surchargent via
# ansible_ssh_private_key_file (pve-host.yml, home-nas.yml).
private_key_file           = ../secrets/ssh/vm_admin
host_key_checking          = False
interpreter_python         = auto_silent
allow_world_readable_tmpfiles = True
# host_group_vars doit rester listé explicitement : vars_plugins_enabled REMPLACE
# la liste par défaut plutôt que de l'étendre, et host_group_vars est le plugin
# natif qui charge les group_vars/host_vars en clair. Sans lui, plus rien ne se
# chargerait sauf les fichiers *.sops.yaml.
vars_plugins_enabled = host_group_vars,community.sops.sops

[privilege_escalation]
become        = True
become_method = sudo

[inventory]
enable_plugins = netbox.netbox.nb_inventory, auto, yaml, ini
