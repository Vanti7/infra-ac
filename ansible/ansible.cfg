[defaults]
inventory                  = inventory/terraform.yml
roles_path                 = roles
remote_user                = admin
host_key_checking          = False
interpreter_python         = auto_silent
allow_world_readable_tmpfiles = True
# host_group_vars doit rester listé explicitement : vars_plugins_enabled REMPLACE
# la liste par défaut plutôt que de l'étendre, et host_group_vars est le plugin
# natif qui charge les group_vars/host_vars en clair. Sans lui, plus rien ne se
# chargerait sauf les fichiers *.sops.yaml.
vars_plugins_enabled = host_group_vars,community.sops.sops

[privilege_escalation]
become        = True
become_method = sudo

[inventory]
enable_plugins = netbox.netbox.nb_inventory, auto, yaml, ini
