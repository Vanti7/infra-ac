apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://traefik.github.io/charts
    chart: traefik
    targetRevision: 41.1.1
    helm:
      values: |
        # hostPort 443 sur seulement 2 workers : un rolling update en surge
        # (défaut du chart) ne trouve nulle part où scheduler le 3e pod.
        # maxUnavailable=1/maxSurge=0 remplace un pod à la fois à la place.
        deployment:
          replicas: 2
        updateStrategy:
          rollingUpdate:
            maxSurge: 0
            maxUnavailable: 1
        ports:
          web:
            proxyProtocol:
              trustedIPs: ["10.42.0.1/32"]
          websecure:
            hostPort: 443
            proxyProtocol:
              trustedIPs: ["10.42.0.1/32"]
        service:
          spec:
            type: ClusterIP
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
