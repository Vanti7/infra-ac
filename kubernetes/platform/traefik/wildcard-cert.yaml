apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-apps
  namespace: traefik
spec:
  secretName: wildcard-apps-tls
  issuerRef:
    name: gandi-dns01
    kind: ClusterIssuer
  # Uniquement le wildcard : "apps.aetheriscloud.fr" (apex, sans wildcard)
  # partagerait le même enregistrement TXT _acme-challenge.apps que le
  # wildcard, or le webhook Gandi (implémentation simple, une seule valeur
  # par rrset) écrase plutôt que de faire coexister les deux valeurs de
  # challenge — les deux validations se marchent dessus. Pas requis par le
  # plan (seul *.apps.aetheriscloud.fr l'est).
  dnsNames:
    - "*.apps.aetheriscloud.fr"
---
apiVersion: traefik.io/v1alpha1
kind: TLSStore
metadata:
  name: default
  namespace: traefik
spec:
  defaultCertificate:
    secretName: wildcard-apps-tls
