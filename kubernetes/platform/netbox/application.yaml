apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: netbox
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://charts.netbox.oss.netboxlabs.com/
    chart: netbox
    targetRevision: 8.3.47
    helm:
      values: |
        # Revu : accès via Traefik (pas de port dans l'URL), pas ipAllowList.
        # L'ipAllowList aurait bloqué tout le monde (WireGuard en split-tunnel,
        # cf. déviation encore visible dans le workflow) — l'accès direct par
        # NodePort marchait mais imposait de taper l'IP *et* le port, jugé
        # inacceptable. Traefik est un simple reverse-proxy sans porte d'auth
        # (contrairement à Teleport) : le vrai contrôle d'accès reste le SSO
        # Keycloak, pas l'IP source — cohérent avec sso.aetheriscloud.fr qui
        # fonctionne déjà exactement comme ça.
        service:
          type: ClusterIP

        ingress:
          enabled: true
          className: traefik
          hosts:
            - host: netbox.aetheriscloud.fr
              paths:
                - /
          tls:
            - secretName: netbox-aetheriscloud-fr-tls
              hosts:
                - netbox.aetheriscloud.fr

        superuser:
          existingSecret: netbox-superuser

        # Le champ s'appelle `existingSecret` (singulier), pas
        # `existingSecretName` — celui-ci n'existe pas dans le schéma de ce
        # sous-chart et était silencieusement ignoré. Sans lui, le chart
        # régénère un mot de passe aléatoire à CHAQUE sync (le mécanisme
        # "réutilise le mot de passe existant" du chart repose sur la
        # fonction Helm `lookup`, qui ne fonctionne que sous `helm
        # install`/`upgrade` — jamais sous `helm template`, ce qu'utilise
        # ArgoCD). Sans existingSecret, postgres s'initialise avec UN mot de
        # passe, ArgoCD en régénère un AUTRE au sync suivant : mismatch
        # permanent. Clé "password" = défaut du chart (auth.secretKeys.userPasswordKey).
        postgresql:
          enabled: true
          auth:
            existingSecret: netbox-postgresql-fixed

        remoteAuth:
          enabled: true
          backends:
            - social_core.backends.open_id_connect.OpenIdConnectAuth

        # `extraConfig` (mécanisme documenté par le chart) ne fonctionne pas avec
        # cette image : le loader de config de NetBox (netbox/configuration.py)
        # ne scanne que /etc/netbox/config/*.py, pas les .yaml montés ailleurs
        # par extraConfig. Montage direct à la place, en Python valide.
        extraVolumes:
          - name: sso-config
            secret:
              secretName: netbox-sso-config
        extraVolumeMounts:
          - name: sso-config
            mountPath: /etc/netbox/config/990-sso.py
            subPath: sso.py
            readOnly: true

        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            memory: 2Gi

        # 1 primaire + 3 répliques par défaut, très excessif pour un IPAM à
        # usage unique sur ce cluster. Simple cache/queue, pas besoin de HA.
        # existingSecret : même bug lookup/ArgoCD que postgresql ci-dessus,
        # mais celui-ci a le bon nom de champ dans son schéma — juste jamais
        # positionné initialement.
        valkey:
          replica:
            replicaCount: 0
          auth:
            existingSecret: netbox-valkey-fixed
  destination:
    server: https://kubernetes.default.svc
    namespace: netbox
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
