apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: harbor
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: https://helm.goharbor.io
    chart: harbor
    targetRevision: 1.19.2
    helm:
      values: |
        # Revu : accès via Traefik (vrai cert, pas de port dans l'URL), plus
        # de NodePort/IP privée. Traefik est un simple reverse-proxy sans
        # porte d'auth (contrairement à Teleport, cf. workflow) : ça ne
        # casse pas l'auth du registre pour containerd, qui pull maintenant
        # via le même hostname public que les humains — plus besoin du
        # contournement plain-HTTP/insecure_skip_verify de registries.yaml.
        expose:
          type: ingress
          tls:
            enabled: true
            certSource: secret
            secret:
              secretName: harbor-aetheriscloud-fr-tls
          ingress:
            hosts:
              core: harbor.aetheriscloud.fr
            className: traefik
            annotations: {}

        externalURL: https://harbor.aetheriscloud.fr

        existingSecretAdminPassword: harbor-admin-secret
        existingSecretAdminPasswordKey: HARBOR_ADMIN_PASSWORD
  destination:
    server: https://kubernetes.default.svc
    namespace: harbor
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
