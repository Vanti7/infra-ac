apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: gandi-dns01
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: admin@aetheriscloud.fr
    privateKeySecretRef:
      name: gandi-dns01-account-key
    solvers:
      - dns01:
          webhook:
            groupName: acme.aetheriscloud.fr
            solverName: gandi
            config:
              apiKeySecretRef:
                name: gandi-credentials
                key: api-token
