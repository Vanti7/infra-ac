server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Même correctif que docs-public : sans ça, le 301 auto de try_files sur
    # $uri/ construit une URL absolue avec le port/scheme internes du
    # conteneur, injoignable via Teleport app_service.
    absolute_redirect off;

    location / {
        try_files $uri $uri/ /404.html;
    }
}
