# Racine kustomize dédiée aux secrets chiffrés SOPS/ksops (C3 de l'audit).
# Doit être la racine `source.path` de sa PROPRE Application ArgoCD
# (kubernetes/platform/secrets/application.yaml) — PAS un sous-dossier
# récupéré par le directory-recurse de "platform" : ArgoCD ne détecte
# kustomization.yaml qu'à la racine du `source.path` d'une Application,
# jamais en récursif dans un dossier brut (vérifié en conditions réelles,
# cf. workflow-deploiement-dedibox.md).
#
# argocd-secret et sops-age-key sont volontairement absents : le premier mélange
# des clés gérées par le chart ArgoCD lui-même (server.secretkey, admin.password)
# avec notre clé oidc — on utilise plutôt un secret dédié (argocd-oidc-secret,
# référencé via `$argocd-oidc-secret:oidc.clientSecret` dans bootstrap/values.yaml).
# Le second est la clé qui déchiffre tout ceci : ne peut pas se chiffrer elle-même.
generators:
  - argocd-oidc-secret.generator.yaml
  - gandi-credentials.generator.yaml
  - gitea-db-secret.generator.yaml
  - gitea-oauth-keycloak.generator.yaml
  - grafana-admin-secret.generator.yaml
  - grafana-oidc-secret.generator.yaml
  - harbor-admin-secret.generator.yaml
  - netbox-postgresql-fixed.generator.yaml
  - netbox-sso-config.generator.yaml
  - netbox-superuser.generator.yaml
  - netbox-valkey-fixed.generator.yaml
  - portal-secrets.generator.yaml
