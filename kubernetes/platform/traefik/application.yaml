apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://traefik.github.io/charts
    chart: traefik
    targetRevision: 41.1.1
    helm:
      values: |
        deployment:
          replicas: 2
        ports:
          web:
            proxyProtocol:
              trustedIPs: ["10.42.0.1/32"]
          websecure:
            hostPort: 443
            proxyProtocol:
              trustedIPs: ["10.42.0.1/32"]
        service:
          spec:
            type: ClusterIP
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
