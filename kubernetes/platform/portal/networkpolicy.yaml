# I6 : default-deny + allow explicites. Portail exposé publiquement via
# Traefik (apex aetheriscloud.fr), OIDC Keycloak, pas de besoin Internet ni
# d'accès à l'apiserver (le portail ne fait qu'afficher des liens statiques).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: portal-default
  namespace: portal
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - ipBlock: {cidr: 10.42.0.6/32}
      ports:
        - {protocol: TCP, port: 443}
