# I6 : default-deny + allow explicites. Doc statique servie par nginx,
# accessible uniquement via l'app_service Teleport (browser session-gated).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: docs-internal-default
  namespace: docs-internal
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: teleport-agent
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
