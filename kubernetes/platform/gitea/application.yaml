apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitea
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: https://dl.gitea.com/charts/
    chart: gitea
    targetRevision: 12.7.0
    helm:
      values: |
        # RWO unique + verrou LevelDB (queues) : Recreate obligatoire, sinon
        # l'ancien et le nouveau pod se chevauchent brièvement (RollingUpdate
        # par défaut du chart) et le nouveau pod ne peut pas prendre le verrou.
        strategy:
          type: Recreate

        persistence:
          size: 10Gi

        # NodePort (pas ClusterIP) : les nœuds k3s doivent pouvoir "docker pull"
        # depuis ce registre lors du scheduling d'un pod, et la résolution DNS
        # interne au cluster (service ClusterIP/headless) n'est PAS utilisable
        # pour un pull d'image — containerd résout côté hôte, pas côté pod.
        service:
          http:
            type: NodePort
            nodePort: 30300
          # M18 (audit) : Gitea derrière Teleport = pas de git clone/push en
          # CLI (session navigateur requise). NodePort SSH, jamais public —
          # seulement joignable depuis 10.42.0.0/24 / 10.99.0.0/24 (netpol
          # dédiée). L'accès web via Teleport reste inchangé.
          ssh:
            type: NodePort
            nodePort: 30022

        postgresql-ha:
          enabled: false
        postgresql:
          enabled: false
        valkey-cluster:
          enabled: false
        valkey:
          enabled: false

        gitea:
          admin:
            existingSecret: gitea-admin-secret
          config:
            server:
              DOMAIN: gitea.ops.aetheriscloud.fr
              ROOT_URL: https://gitea.ops.aetheriscloud.fr/
              # M18 : clone/push CLI en SSH, indépendant de ROOT_URL (web,
              # via Teleport). IP d'un nœud k3s plutôt qu'un nom : accès
              # WireGuard uniquement, pas de DNS interne pour ça (cf.
              # ansible/roles/dns-interne, qui ne couvre que les hôtes gérés
              # par Ansible, pas le poste admin).
              START_SSH_SERVER: true
              SSH_DOMAIN: 10.42.0.21
              SSH_PORT: 30022
            database:
              DB_TYPE: postgres
              HOST: "gitea-postgresql:5432"
              NAME: gitea
              USER: gitea
            session:
              PROVIDER: memory
            cache:
              ADAPTER: memory
            queue:
              TYPE: level
            packages:
              ENABLED: true
          oauth:
            - name: Keycloak
              provider: openidConnect
              existingSecret: gitea-oauth-keycloak
              autoDiscoverUrl: https://sso.aetheriscloud.fr/realms/infra/.well-known/openid-configuration

        # Le mot de passe DB n'est jamais dans les values (donc jamais dans git) :
        # injecté par variable d'env depuis un Secret créé hors Git (cf. workflow).
        deployment:
          env:
            - name: GITEA__database__PASSWD
              valueFrom:
                secretKeyRef:
                  name: gitea-db-secret
                  key: password
  destination:
    server: https://kubernetes.default.svc
    namespace: gitea
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
