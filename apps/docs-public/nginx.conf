server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Derrière Traefik (TLS terminé en amont) : sans ça, le 301 auto de
    # try_files sur $uri/ (ex: /docs/intro -> /docs/intro/) construit une URL
    # absolue avec le port/scheme internes du conteneur (http://host:8080/...),
    # injoignable depuis l'extérieur. Un Location relatif laisse le navigateur
    # le résoudre contre l'URL publique réelle.
    absolute_redirect off;

    location / {
        try_files $uri $uri/ /404.html;
    }
}
