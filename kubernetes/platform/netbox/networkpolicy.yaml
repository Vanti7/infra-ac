# I6 : default-deny + allow explicites. NetBox exposé publiquement via
# Traefik, OIDC Keycloak, pas de besoin Internet.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: netbox-default
  namespace: netbox
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        # PAS 10.42.0.6 (IP interne Keycloak) : son nginx exige le protocole
        # PROXY (fourni par HAProxy uniquement) et reset toute connexion
        # directe. Chemin qui marche : hairpin par l'IP publique (résolution
        # DNS normale de sso.aetheriscloud.fr, ressort par HAProxy avec
        # PROXY protocol). Vérifié en direct.
        - ipBlock: {cidr: 51.15.191.67/32}
      ports:
        - {protocol: TCP, port: 443}
    - to:
        - podSelector: {}
    - to:
        # netbox-worker : initContainer wait-for-backend fait `kubectl
        # rollout status` (apiserver). PAS 10.43.0.1 (ClusterIP du service
        # kubernetes) : avec kube-router, le DNAT vers l'IP réelle
        # (Endpoints du service kubernetes = 10.42.0.11:6443, k3s-adm) a
        # lieu avant l'évaluation du netpol egress, donc une règle sur le
        # ClusterIP ne matche jamais le paquet réellement filtré — "connection
        # refused" au lieu d'un simple drop. Cibler l'IP réelle du nœud.
        - ipBlock: {cidr: 10.42.0.11/32}
      ports:
        - {protocol: TCP, port: 6443}
