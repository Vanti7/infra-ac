# I9 (audit) : toutes les Application tournaient en `project: default`
# (aucune restriction de repo/destination/ressource cluster). Ce projet
# couvre les apps plateforme (pas les tenants, cf. `tenants.yaml`) : les
# repos Helm externes utilisés + le repo GitOps lui-même, et les seuls
# namespaces plateforme comme destination.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
spec:
  description: Composants plateforme (namespaces système + apps internes, pas les tenants)
  sourceRepos:
    - git@github.com:Vanti7/infra-ac.git
    - https://charts.jetstack.io
    - https://bwolf.github.io/cert-manager-webhook-gandi
    - https://dl.gitea.com/charts/
    - https://helm.goharbor.io
    - https://prometheus-community.github.io/helm-charts
    - https://charts.netbox.oss.netboxlabs.com/
    - https://charts.releases.teleport.dev
    - https://traefik.github.io/charts
  destinations:
    - server: https://kubernetes.default.svc
      namespace: argocd
    - server: https://kubernetes.default.svc
      namespace: cert-manager
    - server: https://kubernetes.default.svc
      namespace: docs-internal
    - server: https://kubernetes.default.svc
      namespace: docs-public
    - server: https://kubernetes.default.svc
      namespace: gitea
    - server: https://kubernetes.default.svc
      namespace: harbor
    - server: https://kubernetes.default.svc
      namespace: monitoring
    - server: https://kubernetes.default.svc
      namespace: netbox
    - server: https://kubernetes.default.svc
      namespace: portal
    - server: https://kubernetes.default.svc
      namespace: teleport-agent
    - server: https://kubernetes.default.svc
      namespace: traefik
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
    - group: apiregistration.k8s.io
      kind: APIService
